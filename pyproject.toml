[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taadeel"
version = "0.3.0"
description = "Legislation change tracker: article alignment, diffs and point in time views for Arabic and English law (not legal advice)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Huda Mueen" }]
keywords = ["legislation", "legal informatics", "Akoma Ntoso", "diff", "Arabic NLP", "UAE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Arabic",
    "Natural Language :: English",
]
dependencies = []

[project.urls]
Repository = "https://github.com/hudasol/Taadeel"
Issues = "https://github.com/hudasol/Taadeel/issues"
Documentation = "https://github.com/hudasol/Taadeel/blob/main/docs/README.md"

[project.scripts]
taadeel = "taadeel.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
extract = ["pypdf>=4", "lxml>=5", "fpdf2>=2.8", "arabic-reshaper>=3", "python-bidi>=0.5"]
store = ["pyarrow>=15"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Hash locked engine files (see docs/EVALUATION_CARD.md): never reformatted or edited.
extend-exclude = ["src/taadeel/align.py", "src/taadeel/diff.py", "src/taadeel/model.py", "src/taadeel/normalize.py",
    "src/taadeel/parse.py", "src/taadeel/synthetic.py", "src/taadeel/temporal.py"]
# Pre registered runs record hashes of these files (v2 engine, runners, English patterns): also left untouched.
# per-file-ignores below keep them out of the lint gate rather than reformatting them.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/taadeel/align_v2.py" = ["ALL"]
"src/taadeel/eval_v2.py" = ["ALL"]
"src/taadeel/heldout.py" = ["ALL"]
"src/taadeel/heldout_v2.py" = ["ALL"]
"src/taadeel/tune_v2.py" = ["ALL"]
"src/taadeel/amend_en.py" = ["ALL"]
"src/taadeel/timeline_v2.py" = ["ALL"]
"src/taadeel/uk_amending2.py" = ["ALL"]
