[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taadeel"
version = "0.1.0"
description = "UAE legislation change tracker: parsing, alignment, diffing, temporal model (not legal advice)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
extract = ["pypdf>=4", "lxml>=5", "fpdf2>=2.8", "arabic-reshaper>=3", "python-bidi>=0.5"]
store = ["pyarrow>=15"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
